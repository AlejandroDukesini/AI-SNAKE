# Netlify solo sirve archivos estaticos: el servidor de Python (FastAPI) no
# arranca aqui. Por eso se publica el BORRADOR: la misma web, pero con la IA
# simulada en el navegador (ver src/lib/demo/). Para la version real, clonar el
# repositorio y ejecutar `npm run dev`.
[build]
  command = "npm run build:demo"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# `netlify dev` en local: levanta el borrador con Vite (sin Python).
[dev]
  command = "npm run dev:demo"
  targetPort = 5173
  framework = "#custom"

# SPA: cualquier ruta sirve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
